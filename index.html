<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MU Sem 7 DL Solutions (Mobile Fast App)</title>
  <meta name="description" content="Mobile-first high-speed study portal and direct PDF reader for Mumbai University Sem 7 Deep Learning">
  <meta name="theme-color" content="#0F172A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8F9FA;
      --bg-panel: #FFFFFF;
      --bg-subtle: #F1F3F5;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --primary: #1E40AF;
      --primary-hover: #1E3A8A;
      --primary-light: #EFF6FF;
      --accent: #D97706;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.dark-mode {
      --bg: #090D16;
      --bg-panel: #0F172A;
      --bg-subtle: #1E293B;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --border: #334155;
      --primary: #38BDF8;
      --primary-hover: #0EA5E9;
      --primary-light: #1E293B;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
    }

    /* Invert PDF pages in Dark Mode for high readability */
    body.dark-mode .page-box canvas {
      filter: invert(0.92) hue-rotate(180deg) contrast(1.1) brightness(1.05);
      background: #FFFFFF;
    }

    body.dark-mode .page-footer-bar {
      background: #0F172A;
      border-color: #334155;
      color: #94A3B8;
    }

    body.dark-mode .page-footer-bar a {
      color: #38BDF8;
    }

    body.dark-mode .jump-drawer,
    body.dark-mode .reader-dock,
    body.dark-mode .page-box {
      background: #0F172A;
      border-color: #334155;
    }

    body.dark-mode .jump-btn {
      background: #1E293B;
      border-color: #334155;
      color: #E2E8F0;
    }

    body.dark-mode .jump-btn:active,
    body.dark-mode .jump-btn:hover {
      background: #334155;
      color: #38BDF8;
      border-color: #38BDF8;
    }

    body.dark-mode .dock-btn {
      background: #1E293B;
      border-color: #334155;
      color: #E2E8F0;
    }

    body.dark-mode .dock-btn:active {
      background: #334155;
    }

    body.dark-mode .mobile-hero-actions {
      background: #0F172A;
      border-color: #334155;
    }

    body.dark-mode .btn-download {
      background: #1E293B;
      border-color: #334155;
      color: #F1F5F9 !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Sticky Mobile Header */
    header {
      background: #0F172A;
      color: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-mu {
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    .header-stat {
      font-size: 0.75rem;
      color: #94A3B8;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* Horizontal Scrollable Tabs on Mobile */
    .module-nav {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 0.4rem 0.6rem;
      gap: 0.4rem;
      background: #1E293B;
    }

    .module-nav::-webkit-scrollbar {
      display: none;
    }

    .mod-pill {
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #CBD5E1;
      padding: 0.42rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .mod-pill:active {
      transform: scale(0.96);
    }

    .mod-pill.active {
      background: #3B82F6;
      border-color: #3B82F6;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    }

    /* Mobile Hero Action Bar */
    .mobile-hero-actions {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0.85rem;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.75rem 0.6rem;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .btn-viewer {
      background: #0F172A;
      color: #FFFFFF !important;
      border: 1px solid #0F172A;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }

    .btn-download {
      background: var(--bg-subtle);
      color: var(--text-main) !important;
      border: 1px solid var(--border);
    }

    /* Quick Tip */
    .mobile-tip {
      margin-top: 0.45rem;
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    /* Main Content Area */
    main {
      padding: 0.75rem 0.6rem 4rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Jump to Question Drawer / Horizontal Scroll */
    .jump-drawer {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow-sm);
    }

    .jump-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.55rem;
    }

    .jump-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .jump-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .jump-scroll-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .jump-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.38rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.15s ease;
    }

    .jump-btn:active, .jump-btn:hover {
      background: var(--primary-light);
      border-color: #BFDBFE;
      color: var(--primary);
    }

    /* Zoom / Reading Tools Floating Dock on Mobile */
    .reader-dock {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
    }

    .dock-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .dock-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dock-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .dock-btn:active {
      background: #E2E8F0;
    }

    /* High Quality Mobile PDF Cards */
    .pdf-render-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
    }

    .page-box {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-box canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .page-footer-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.75rem;
      background: #F8FAFC;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .page-footer-bar a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    /* Loading Spinner */
    .loading-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
      width: 100%;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E2E8F0;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.6rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Floating bottom mobile bar */
    .mobile-float-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 99;
    }

    .float-title {
      color: #F8FAFC;
      font-size: 0.76rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55%;
    }

    .float-btn {
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Desktop View Tweaks */
    @media (min-width: 769px) {
      .top-bar {
        padding: 0.85rem 1.5rem;
      }
      .module-nav {
        justify-content: center;
        padding: 0.5rem 1rem;
      }
      .mobile-hero-actions {
        max-width: 900px;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 1rem;
      }
      .mobile-float-bar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header with Horizontal Module Slider -->
  <header>
    <div class="top-bar">
      <div class="brand-wrap">
        <span class="badge-mu">MU Sem 7 AIML</span>
        <span class="brand-name">Deep Learning</span>
      </div>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="dock-btn" style="background:#1E293B; color:#F1F5F9; border-color:#475569; padding:0.35rem 0.65rem; display:inline-flex; align-items:center; gap:0.3rem;">
          <span id="theme-icon">🌙</span>
          <span id="theme-text">Dark</span>
        </button>
        <div class="header-stat" id="header-stat-text">69p</div>
      </div>
    </div>

    <!-- Swipeable Module Pills -->
    <nav class="module-nav" id="module-nav-bar">
      <button class="mod-pill active" id="tab-1" onclick="selectModule(1)">Mod 1: MLP (18p)</button>
      <button class="mod-pill" id="tab-2" onclick="selectModule(2)">Mod 2: Reg & GD (9p)</button>
      <button class="mod-pill" id="tab-3" onclick="selectModule(3)">Mod 3: Autoencoders (12p)</button>
      <button class="mod-pill" id="tab-4" onclick="selectModule(4)">Mod 4: CNN (18p)</button>
      <button class="mod-pill" id="tab-5" onclick="selectModule(5)">Mod 5: RNN (3p)</button>
      <button class="mod-pill" id="tab-6" onclick="selectModule(6)">Mod 6: GAN (9p)</button>
    </nav>
  </header>

  <!-- High-Visibility Action Bar -->
  <section class="mobile-hero-actions">
    <div class="action-row">
      <a id="btn-open-viewer" href="pdfs/Module1_Deep_Learning_Answers.pdf" target="_blank" rel="noopener" class="btn-action btn-viewer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Open Phone PDF Viewer ↗</span>
      </a>

      <a id="btn-download-pdf" href="pdfs/Module1_Deep_Learning_Answers.pdf" download class="btn-action btn-download">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Download</span>
      </a>
    </div>
    <div class="mobile-tip">
      <span>📱 Tip: "Open Phone PDF Viewer" allows full pinch zoom and offline study!</span>
    </div>
  </section>

  <!-- Main View -->
  <main>
    <!-- Question Jump Chips -->
    <section class="jump-drawer">
      <div class="jump-header">
        <span class="jump-title" id="jump-header-title">Questions in Module 1</span>
        <span class="jump-sub">Tap to scroll</span>
      </div>
      <div class="jump-scroll-row" id="jump-chips-container">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- Reading Zoom Bar -->
    <div class="reader-dock">
      <span class="dock-label">Mobile Zoom:</span>
      <div class="dock-controls">
        <button class="dock-btn" onclick="adjustZoom(-0.25)">A-</button>
        <button class="dock-btn" onclick="resetZoom()">Default</button>
        <button class="dock-btn" onclick="adjustZoom(0.35)">A+</button>
        <button class="dock-btn" onclick="adjustZoom(0.9)" style="background:#38BDF8; color:#0F172A; border-color:#38BDF8; font-weight:800;">Large</button>
      </div>
    </div>

    <!-- PDF Render Area -->
    <div class="pdf-render-area" id="render-area">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading document pages...</p>
      </div>
    </div>
  </main>

  <!-- Floating Sticky Bottom Bar for Mobile Convenience -->
  <div class="mobile-float-bar">
    <div class="float-title" id="float-module-title">Mod 1: Multilayer Perceptrons & Optimization</div>
    <a id="btn-float-open" href="pdfs/Module1_Deep_Learning_Answers.pdf" target="_blank" rel="noopener" class="float-btn">
      <span>Read in Viewer ↗</span>
    </a>
  </div>

  <script src="pdf.min.js"></script>
  <script>
    // Clean old caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let r of registrations) r.unregister();
      });
      if (window.caches) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
    }

    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
    }

    const DATA = {
      1: {
        title: "Module 1: Multilayer Perceptrons & Optimization",
        file: "pdfs/Module1_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q1. Representation Power of MLPs & XOR", page: 1 },
          { label: "Q2. Feedforward Neural Networks Architecture", page: 4 },
          { label: "Q3. Three Classes of Deep Learning (SL, UL, RL)", page: 7 },
          { label: "Q4. Gradient Descent & SSE Derivation", page: 10 },
          { label: "Q5. AND Gate Design via Single-Layer Perceptron", page: 13 },
          { label: "Q6. XOR Gate Design via Multilayer Perceptron", page: 16 }
        ]
      },
      2: {
        title: "Module 2: Activation, Optimization & Regularization",
        file: "pdfs/Module2_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q1. Significance & Types of Activation Functions", page: 1 },
          { label: "Q2. Gradient Descent & Three Methods (BGD, SGD, MBGD)", page: 4 },
          { label: "Q3. Dropout Regularization & Anti-Overfitting", page: 7 }
        ]
      },
      3: {
        title: "Module 3: Autoencoders & Representation Learning",
        file: "pdfs/Module3_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q2. Denoising Autoencoder (DAE) Architecture & Working", page: 1 },
          { label: "Q5. Image Compression using Autoencoders", page: 4 },
          { label: "Q3. Regularization in Autoencoders (Sparsity, CAE, DAE, Decay)", page: 7 },
          { label: "Q4. Undercomplete vs. Overcomplete Autoencoders", page: 10 }
        ]
      },
      4: {
        title: "Module 4: Convolutional Neural Networks (CNN)",
        file: "pdfs/Module4_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q1. CNN Architecture & Working", page: 1 },
          { label: "Q2. Convolution, Padding & Stride", page: 4 },
          { label: "Q3. ResNet Architecture & Skip Connections", page: 7 },
          { label: "Q4. AlexNet Architecture & Innovations", page: 10 },
          { label: "Q5. LeNet-5 Architecture & Digit Recognition", page: 13 },
          { label: "Q6. Comparison (LeNet vs AlexNet vs ResNet)", page: 16 }
        ]
      },
      5: {
        title: "Module 5: Recurrent Neural Networks (RNN)",
        file: "pdfs/Module5_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q1. RNN Architecture, Unfolding & Equations", page: 1 }
        ]
      },
      6: {
        title: "Module 6: Generative Adversarial Networks (GAN)",
        file: "pdfs/Module6_Deep_Learning_Answers.pdf",
        questions: [
          { label: "Q1. GAN Concept, Architecture & Working", page: 1 },
          { label: "Q2. GAN Roles, Competition & Training Dynamics", page: 4 },
          { label: "Q3. Applications of GAN (Image, DeepFake, Translation, SR)", page: 7 }
        ]
      }
    };

    let activeMod = 1;
    let pdfDoc = null;
    let zoomModifier = 0.2; // Default to larger comfortable text size for mobile reading

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (isDark) {
        icon.textContent = '☀️';
        text.textContent = 'Light';
        localStorage.setItem('mu_theme', 'dark');
      } else {
        icon.textContent = '🌙';
        text.textContent = 'Dark';
        localStorage.setItem('mu_theme', 'light');
      }
    }

    // Initialize theme from storage
    if (localStorage.getItem('mu_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      window.addEventListener('DOMContentLoaded', () => {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (icon && text) {
          icon.textContent = '☀️';
          text.textContent = 'Light';
        }
      });
    }

    async function selectModule(modId) {
      activeMod = modId;
      const mod = DATA[modId];

      // Update Tab Pill UI
      [1, 2, 3, 4, 5, 6].forEach(id => {
        const el = document.getElementById(`tab-${id}`);
        if (el) el.classList.toggle('active', id === modId);
      });

      // Update Action Buttons
      const viewerBtn = document.getElementById('btn-open-viewer');
      const downloadBtn = document.getElementById('btn-download-pdf');
      const floatBtn = document.getElementById('btn-float-open');
      const floatTitle = document.getElementById('float-module-title');

      viewerBtn.setAttribute('href', mod.file);
      downloadBtn.setAttribute('href', mod.file);
      floatBtn.setAttribute('href', mod.file);
      floatTitle.textContent = mod.title;

      // Update Jump Chips
      document.getElementById('jump-header-title').textContent = `${mod.title} (${mod.questions.length} Questions)`;
      const chipsContainer = document.getElementById('jump-chips-container');
      chipsContainer.innerHTML = '';
      mod.questions.forEach(q => {
        const btn = document.createElement('button');
        btn.className = 'jump-btn';
        btn.textContent = `${q.label} (p.${q.page})`;
        btn.onclick = () => {
          const target = document.getElementById(`page-node-${q.page}`);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };
        chipsContainer.appendChild(btn);
      });

      // Render PDF
      await renderCurrentModule();
    }

    async function renderCurrentModule() {
      const mod = DATA[activeMod];
      const renderArea = document.getElementById('render-area');
      renderArea.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Rendering ${mod.title} for mobile...</p>
        </div>
      `;

      try {
        pdfDoc = await pdfjsLib.getDocument(mod.file).promise;
        renderArea.innerHTML = '';

        const dpr = window.devicePixelRatio || 1;
        // On phone, use full available width with small margin
        const screenWidth = Math.min(window.innerWidth - 16, 860);

        for (let p = 1; p <= pdfDoc.numPages; p++) {
          const page = await pdfDoc.getPage(p);
          const rawViewport = page.getViewport({ scale: 1.0 });

          // Scale factor
          const baseScale = screenWidth / rawViewport.width;
          const effectiveScale = baseScale + zoomModifier;
          const displayViewport = page.getViewport({ scale: effectiveScale });
          // Render with retina backing store (capped at 2.2x for speed & crisp text)
          const renderViewport = page.getViewport({ scale: effectiveScale * Math.min(dpr, 2.2) });

          const box = document.createElement('div');
          box.className = 'page-box';
          box.id = `page-node-${p}`;
          box.style.width = `${displayViewport.width}px`;

          const canvas = document.createElement('canvas');
          canvas.width = renderViewport.width;
          canvas.height = renderViewport.height;
          canvas.style.width = `${displayViewport.width}px`;
          canvas.style.height = `${displayViewport.height}px`;

          const footer = document.createElement('div');
          footer.className = 'page-footer-bar';
          footer.innerHTML = `
            <span>Page ${p} of ${pdfDoc.numPages}</span>
            <a href="${mod.file}#page=${p}" target="_blank" rel="noopener">Open page in PDF app ↗</a>
          `;

          box.appendChild(canvas);
          box.appendChild(footer);
          renderArea.appendChild(box);

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: renderViewport
          }).promise;
        }
      } catch (err) {
        console.error("Render error:", err);
        renderArea.innerHTML = `
          <div class="loading-state">
            <p style="color: #DC2626; font-weight: 700;">Mobile preview render paused</p>
            <p style="margin-top: 0.6rem;"><a href="${mod.file}" target="_blank" class="btn-action btn-viewer">Tap here to open in Phone PDF Viewer</a></p>
          </div>
        `;
      }
    }

    function adjustZoom(delta) {
      zoomModifier = Math.max(zoomModifier + delta, -0.3);
      renderCurrentModule();
    }

    function resetZoom() {
      zoomModifier = 0;
      renderCurrentModule();
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Default to Module 1
      selectModule(1);
    });
  </script>
</body>
</html>
